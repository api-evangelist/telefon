naftiko: 1.0.0-alpha2
info:
  label: Telefon Number Management API — Owned Numbers
  description: 'Telefon Number Management API — Owned Numbers. 4 operations. Lead operation: List Owned Numbers. Self-contained
    Naftiko capability covering one Telefon business surface.'
  tags:
  - Telefon
  - Owned Numbers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELEFON_API_KEY: TELEFON_API_KEY
capability:
  consumes:
  - type: http
    namespace: numbers-owned-numbers
    baseUri: https://api.telefon.com/v1/numbers
    description: Telefon Number Management API — Owned Numbers business capability. Self-contained, no shared references.
    resources:
    - name: owned
      path: /owned
      operations:
      - name: listownednumbers
        method: GET
        description: List Owned Numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter by number type
        - name: page
          in: query
          type: integer
          description: Page number
        - name: page_size
          in: query
          type: integer
          description: Results per page
      - name: purchasenumber
        method: POST
        description: Purchase Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: owned-phone_number
      path: /owned/{phone_number}
      operations:
      - name: getownednumber
        method: GET
        description: Get Owned Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: path
          type: string
          description: Phone number in E.164 format
          required: true
      - name: releasenumber
        method: DELETE
        description: Release Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: path
          type: string
          description: Phone number in E.164 format
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.TELEFON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: numbers-owned-numbers-rest
    port: 8080
    description: REST adapter for Telefon Number Management API — Owned Numbers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/owned
      name: owned
      description: REST surface for owned.
      operations:
      - method: GET
        name: listownednumbers
        description: List Owned Numbers
        call: numbers-owned-numbers.listownednumbers
        with:
          type: rest.type
          page: rest.page
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: purchasenumber
        description: Purchase Number
        call: numbers-owned-numbers.purchasenumber
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/owned/{phone-number}
      name: owned-phone-number
      description: REST surface for owned-phone_number.
      operations:
      - method: GET
        name: getownednumber
        description: Get Owned Number
        call: numbers-owned-numbers.getownednumber
        with:
          phone_number: rest.phone_number
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: releasenumber
        description: Release Number
        call: numbers-owned-numbers.releasenumber
        with:
          phone_number: rest.phone_number
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: numbers-owned-numbers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telefon Number Management API — Owned Numbers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-owned-numbers
      description: List Owned Numbers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: numbers-owned-numbers.listownednumbers
      with:
        type: tools.type
        page: tools.page
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: purchase-number
      description: Purchase Number
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: numbers-owned-numbers.purchasenumber
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-owned-number
      description: Get Owned Number
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: numbers-owned-numbers.getownednumber
      with:
        phone_number: tools.phone_number
      outputParameters:
      - type: object
        mapping: $.
    - name: release-number
      description: Release Number
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: numbers-owned-numbers.releasenumber
      with:
        phone_number: tools.phone_number
      outputParameters:
      - type: object
        mapping: $.
