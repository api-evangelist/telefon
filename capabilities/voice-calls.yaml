naftiko: 1.0.0-alpha2
info:
  label: Telefon Voice API — Calls
  description: 'Telefon Voice API — Calls. 4 operations. Lead operation: List Calls. Self-contained Naftiko capability covering
    one Telefon business surface.'
  tags:
  - Telefon
  - Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELEFON_API_KEY: TELEFON_API_KEY
capability:
  consumes:
  - type: http
    namespace: voice-calls
    baseUri: https://api.telefon.com/v1/voice
    description: Telefon Voice API — Calls business capability. Self-contained, no shared references.
    resources:
    - name: calls
      path: /calls
      operations:
      - name: listcalls
        method: GET
        description: List Calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by call status
        - name: direction
          in: query
          type: string
          description: Filter by call direction
        - name: page
          in: query
          type: integer
          description: Page number
        - name: page_size
          in: query
          type: integer
          description: Results per page
      - name: createcall
        method: POST
        description: Create Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: calls-call_id
      path: /calls/{call_id}
      operations:
      - name: getcall
        method: GET
        description: Get Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: call_id
          in: path
          type: string
          description: Unique call identifier
          required: true
      - name: endcall
        method: DELETE
        description: End Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: call_id
          in: path
          type: string
          description: Unique call identifier
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.TELEFON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: voice-calls-rest
    port: 8080
    description: REST adapter for Telefon Voice API — Calls. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/calls
      name: calls
      description: REST surface for calls.
      operations:
      - method: GET
        name: listcalls
        description: List Calls
        call: voice-calls.listcalls
        with:
          status: rest.status
          direction: rest.direction
          page: rest.page
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcall
        description: Create Call
        call: voice-calls.createcall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/calls/{call-id}
      name: calls-call-id
      description: REST surface for calls-call_id.
      operations:
      - method: GET
        name: getcall
        description: Get Call
        call: voice-calls.getcall
        with:
          call_id: rest.call_id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: endcall
        description: End Call
        call: voice-calls.endcall
        with:
          call_id: rest.call_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: voice-calls-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telefon Voice API — Calls. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-calls
      description: List Calls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-calls.listcalls
      with:
        status: tools.status
        direction: tools.direction
        page: tools.page
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: create-call
      description: Create Call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: voice-calls.createcall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-call
      description: Get Call
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-calls.getcall
      with:
        call_id: tools.call_id
      outputParameters:
      - type: object
        mapping: $.
    - name: end-call
      description: End Call
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: voice-calls.endcall
      with:
        call_id: tools.call_id
      outputParameters:
      - type: object
        mapping: $.
