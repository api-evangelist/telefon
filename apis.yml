name: Telefon
description: >-
  Telefon is a cloud-based programmable communications platform providing voice calling, SMS messaging, number
  management, and call recording APIs for developers and enterprises. The platform enables applications to make and
  receive phone calls, send SMS and MMS messages, manage phone number inventories, and record calls for compliance and
  quality assurance purposes. Telefon supports global coverage across 180+ countries with competitive per-minute and
  per-message pricing.
