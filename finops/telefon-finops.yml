      - Communications
      - Messaging
      - MMS
      - SMS
      - Two-Way SMS
      - Unicode
    serviceName: Telefon SMS API
    serviceCategory: API
  - name: Telefon Number Management API
    baseURL: https://api.telefon.com/v1/numbers
    tags:
      - DID
      - Number Management
      - Number Portability
      - Number Provisioning
      - Phone Numbers
      - Short Codes
      - Toll-Free
    serviceName: Telefon Number Management API
    serviceCategory: API
  - name: Telefon Call Recording API
    baseURL: https://api.telefon.com/v1/recording
